<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NextMove demo film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f7f2;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #f7f7f2;
      }
    </style>
  </head>
  <body>
    <!--
      NextMove demo film, 1920x1080, 30 fps, 180 s, cut to "Nonstop" (128 BPM): every scene starts on a downbeat.
      Scenes are written in film/scenes/ and built into compositions/ by `node film/build.mjs`. See STORYBOARD.md.
      Footage in assets/media/v2 is real UI recorded from the running app on isolated demo tenants (see capture/).
      Blocks: 0:00-0:36 user, problem, solution | 0:36-2:06 working demo | 2:06-2:32 value | 2:32-3:00 build, limits, next.
      The score is re-cut on whole bars to match (capture/build-score.sh): 3 intro bars repeated, 2 bars before c9 and 1 bar in c9 removed.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="180" data-width="1920" data-height="1080">
      <div id="c1" data-composition-id="c1" data-composition-src="compositions/c1-open.html" data-start="0" data-duration="35.625" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c2" data-composition-id="c2" data-composition-src="compositions/c2-fitflow.html" data-start="35.625" data-duration="30" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c3" data-composition-id="c3" data-composition-src="compositions/c3-putwork.html" data-start="65.625" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c4" data-composition-id="c4" data-composition-src="compositions/c4-offscript.html" data-start="73.125" data-duration="22.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c5" data-composition-id="c5" data-composition-src="compositions/c5-sim.html" data-start="95.625" data-duration="11.25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c6" data-composition-id="c6" data-composition-src="compositions/c6-airbag.html" data-start="106.875" data-duration="11.25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c7" data-composition-id="c7" data-composition-src="compositions/c7-more.html" data-start="118.125" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c8" data-composition-id="c8" data-composition-src="compositions/c8-value.html" data-start="125.625" data-duration="26.25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c9" data-composition-id="c9" data-composition-src="compositions/c9-build.html" data-start="151.875" data-duration="18.75" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c10" data-composition-id="c10" data-composition-src="compositions/c10-close.html" data-start="170.625" data-duration="9.375" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- "Nonstop" by Kevin MacLeod (incompetech.com), CC BY 4.0. See assets/audio/LICENSE.md. -->
      <audio id="score" class="clip" data-start="0" data-duration="180" data-track-index="2" data-volume="1" src="assets/audio/score-nonstop.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
